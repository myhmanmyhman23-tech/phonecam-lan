plugins { id 'com.android.application' version '9.1.1' }
android {
    namespace 'tech.phonecam.lan'
    compileSdk { version = release(37) }
    defaultConfig {
        applicationId 'tech.phonecam.lan'
        minSdk 29
        targetSdk 37
        versionCode 3
        versionName '0.3.0'
    }
    signingConfigs {
        release {
            if (System.getenv('PHONECAM_KEYSTORE')) {
                storeFile file(System.getenv('PHONECAM_KEYSTORE'))
                storePassword System.getenv('PHONECAM_STORE_PASSWORD')
                keyAlias 'phonecam'
                keyPassword System.getenv('PHONECAM_STORE_PASSWORD')
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
