name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install decoder for stream compatibility check
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test stream protocol and FFmpeg decoder
        run: |
          mkdir -p /tmp/phonecam-tests
          javac -d /tmp/phonecam-tests src/main/java/tech/phonecam/lan/MjpegServer.java tests/ServerTest.java
          java -cp /tmp/phonecam-tests tech.phonecam.lan.ServerTest ffmpeg
      - name: Build and lint Android app
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-LAN-APK
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: build/reports/lint-results-debug.html
