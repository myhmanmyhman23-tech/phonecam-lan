name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install decoder for stream compatibility check
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test stream protocol and FFmpeg decoder
        run: |
          mkdir -p /tmp/phonecam-tests
          javac -d /tmp/phonecam-tests src/main/java/tech/phonecam/lan/MjpegServer.java tests/ServerTest.java
          java -cp /tmp/phonecam-tests tech.phonecam.lan.ServerTest ffmpeg
      - name: Build and lint Android app
        run: gradle assembleDebug lintDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PhoneCam-LAN-APK
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish downloadable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.0-build-${{ github.run_number }}" build/outputs/apk/debug/*.apk \
            --target "$GITHUB_SHA" --title "PhoneCam LAN test build ${{ github.run_number }}" \
            --notes "Test APK for Android 8+. See README for OBS setup. Screen-off camera behavior still needs testing on your phone." --prerelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-lint-report
          path: build/reports/lint-results-debug.html
